[project]
name = "audiochan-archive"
version = "0.1.0"
description = "Переносимая локальная библиотека Audiochan"
requires-python = ">=3.13,<3.14"
dependencies = ["curl-cffi==0.16.0", "mutagen==1.47.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=var/test-temp"
